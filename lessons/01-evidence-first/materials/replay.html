<script>
'use strict';
const data = JSON.parse(document.getElementById('replay-data').textContent);
const $ = id => document.getElementById(id);
const names = ['正常查询','没有资料','换一个问题','真实失败','引用反例','学员自测'];
let scene = 0, step = 0;
function text(id,value){$(id).textContent=value;}
function select(i){scene=i;step = 0;render();}
names.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>select(i);$('scenes').append(b);});
function render(){
 Array.from($('scenes').children).forEach((b,i)=>b.setAttribute('aria-pressed',String(i===scene)));
 const real=scene<4, run=scene<3?data.runs[scene]:data.failure;
 $('stage').classList.toggle('failure',scene===3);
 text('title',names[scene]); text('metadata',`记录：${scene===3?data.failure_recorded_at_utc:data.recorded_at_utc} · 模型：${data.model}（可配置） · 每次运行上限：4模型轮 / 3工具调用`);
 if(real){
  text('question',run.query);
  text('leftTitle',step===0?'先预测：什么结果才有依据？':step===1?'模型选择的工具参数':'工具实际返回的证据');
  text('rightTitle',step<3?'先核对观察，再揭示结论':scene===3?'真实失败 · 原始答案与状态':'模型答案 · 请逐句回查');
  const r=run.result;
  if(step===0)text('left',scene===1||scene===3?'当前语料只有 Agent loop 与会话记忆。\n\n预测：这次会有匹配材料吗？\n\n先说理由，再点“先看参数”。':'找到匹配主题后，还需要什么？\n\n① 模型选了哪些检索词？\n② 工具实际返回了哪个编号？\n③ 原文支持答案中的每句话吗？');
  if(step===1)text('left',r.tools.map((t,i)=>`调用 ${i+1} · ${t.call_id}\n${t.name}(${JSON.stringify(t.arguments)})`).join('\n\n'));
  if(step>=2)text('left',r.tools.map((t,i)=>`调用 ${i+1} → ${t.source_ids.length?t.source_ids.join(' / '):'空列表 []'}\n${t.output.map(x=>`[${x.id}] ${x.text}`).join('\n')}`.trimEnd()).join('\n\n'));
  text('right',step<3?'回答暂未揭示。\n\n请先对照工具返回，判断哪些话可以说、哪些话没有依据。':scene===3?r.answer:`${r.answer}\n\n状态：${r.status} · 退出码：${run.exit_code}\n模型轮：${r.model_turns} / 工具：${r.tools.length}\n轨迹：${r.nodes.join(' → ')}`);
  if(scene===3&&step===3){text('left',$('left').textContent+'\n\n失败原因：未返回N01却引用N01；2次调用没有耗尽3次预算。\n\n状态：failed · 退出码：1');} 
  text('hint',scene===2?'同轮提出两个请求；程序逐项执行，不是并行证明。':scene===3?'不利记录保留；这不是最终三场景的成功记录。':'三个问题分别独立启动，不是跨请求记忆测试。');
 }else if(scene===4){
  text('question','手工构造的教学反例 · 不是模型真实输出');
  text('leftTitle','原文 [N01]');text('left',data.notes.find(n=>n.id==='N01').text);
  text('rightTitle',step<3?'先判断：编号真实，结论就可信吗？':'判断依据');
  text('right','[N01] Agent 能自动完成所有任务。'+(step>=3?'\n\n不受支持。原文描述循环及轮次限制，没有保证所有任务均能完成。真编号不等于结论正确。':''));
  text('hint','这条句子由讲师手工构造，不能当作模型失败测量。');
 }else{
  text('question','请用“换一个问题”的记录回答，先不要揭晓。');text('leftTitle','先预测 / 自测');
  text('left','① 两个检索词分别是什么？\n\n② N02在哪里实际返回过？\n\n③ “不同会话应隔离”被哪句原文支持？');
  text('rightTitle',step<3?'给自己20秒，再查看回答':'核对答案');
  text('right',step<3?'请在纸上或本地文档写三行答案。\n\n可回到第3个场景寻找字段。':'① 会话记忆 memory；memory agent loop。\n\n② 两次工具output中都有N02。\n\n③ N02正文：“不同会话应隔离。”');
  text('hint','验收：必须指向参数、真实返回和原文，不能只写“带编号”。');
 }
 text('advance',['先看参数','再看证据','查看回答','已全部揭示'][step]);$('advance').disabled=step===3;
}
function advance(){step=Math.min(3,step+1);render();}
$('advance').onclick=advance;$('reset').onclick=()=>{step = 0;render();};
function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
$('full').onclick=full;
document.addEventListener('keydown',e=>{if(e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();advance();}if(e.key==='ArrowLeft'){step=Math.max(0,step-1);render();}if('123'.includes(e.key)&&e.key.length===1)select(Number(e.key)-1);if(e.key.toLowerCase()==='f')full();});
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('stage').style.transform=`scale(${s})`;$('stage').style.left=(innerWidth-1920*s)/2+'px';$('stage').style.top=(innerHeight-1080*s)/2+'px';}
addEventListener('resize',fit);render();fit();
</script></body></html>
